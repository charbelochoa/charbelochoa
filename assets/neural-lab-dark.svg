<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 278" width="100%" role="img" aria-label="AI and Deep Learning Research Architecture">
  <defs>
    <pattern id="labGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141d2e" stroke-width="0.7"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 6 6; animation: dashFlow 1.6s linear infinite; }
    .flow-rev { stroke-dasharray: 5 7; animation: dashRev 2.2s linear infinite; }
    .attn-1 { animation: cellPulse 2.4s ease-in-out infinite; }
    .attn-2 { animation: cellPulse 2.4s ease-in-out 0.6s infinite; }
    .attn-3 { animation: cellPulse 2.4s ease-in-out 1.2s infinite; }
    .cv-box { animation: scanBox 3.6s ease-in-out infinite; }
    .agent-ring { transform-origin: 754px 142px; animation: spinRing 8s linear infinite; }
    @keyframes dashFlow { to { stroke-dashoffset: -24; } }
    @keyframes dashRev { to { stroke-dashoffset: 24; } }
    @keyframes cellPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
    @keyframes scanBox {
      0%, 100% { transform: translate(0px, 0px); }
      33% { transform: translate(34px, 4px); }
      66% { transform: translate(16px, 16px); }
    }
    @keyframes spinRing { to { transform: rotate(360deg); } }
  </style>

  <!-- Main Canvas -->
  <rect x="2" y="2" width="916" height="274" rx="14" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="4" y="4" width="912" height="270" rx="12" fill="url(#labGrid)" opacity="0.65"/>

  <!-- Header Strip -->
  <text x="26" y="31" class="mono" font-size="13" font-weight="700" fill="#f1f5f9">
    <tspan fill="#fb7185">[NEURAL_PIPELINE]</tspan> // MULTIMODAL AI &amp; DEEP LEARNING RESEARCH ARCHITECTURE
  </text>
  <text x="655" y="31" class="mono" font-size="11" fill="#64748b">TENSOR FLOW: ACTIVE · FP16/BF16</text>
  <line x1="24" y1="43" x2="896" y2="43" stroke="#1e293b" stroke-width="1"/>

  <!-- Animated Tensor Data Buses Connecting the 4 Pillars -->
  <line class="flow" x1="224" y1="145" x2="250" y2="145" stroke="#38bdf8" stroke-width="2.2"/>
  <line class="flow" x1="452" y1="145" x2="478" y2="145" stroke="#fb7185" stroke-width="2.2"/>
  <line class="flow" x1="680" y1="145" x2="706" y2="145" stroke="#c084fc" stroke-width="2.2"/>

  <!-- Residual / Agent Feedback Loop Along Bottom -->
  <path class="flow-rev" d="M 800 236 L 800 254 L 122 254 L 122 236" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.75"/>
  <text x="378" y="267" class="mono" font-size="10" fill="#34d399">↺ AGENT FEEDBACK &amp; GRADIENT BACKPROPAGATION LOOP</text>

  <!-- ================================================================== -->
  <!-- PILLAR 1: LLMs & TRANSFORMERS                                      -->
  <!-- ================================================================== -->
  <rect x="22" y="58" width="202" height="178" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="36" y="80" class="mono" font-size="12" font-weight="700" fill="#38bdf8">01 // LLMs &amp; ATTENTION</text>
  <text x="36" y="96" class="sans" font-size="10.5" fill="#94a3b8">Modelos de Lenguaje · 大语言模型</text>

  <!-- Mini 4x4 Animated Self-Attention Heatmap -->
  <rect x="36" y="108" width="174" height="68" rx="6" fill="#0d1320" stroke="#1e293b" stroke-width="0.8"/>
  <g transform="translate(46, 115)">
    <rect class="attn-1" x="0" y="0" width="12" height="12" rx="2" fill="#38bdf8"/>
    <rect class="attn-2" x="15" y="0" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.4"/>
    <rect class="attn-3" x="30" y="0" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.75"/>
    <rect x="45" y="0" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.2"/>

    <rect x="0" y="15" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.3"/>
    <rect class="attn-2" x="15" y="15" width="12" height="12" rx="2" fill="#38bdf8"/>
    <rect x="30" y="15" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.5"/>
    <rect class="attn-1" x="45" y="15" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.85"/>

    <rect class="attn-3" x="0" y="30" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.65"/>
    <rect x="15" y="30" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.25"/>
    <rect class="attn-1" x="30" y="30" width="12" height="12" rx="2" fill="#38bdf8"/>
    <rect class="attn-2" x="45" y="30" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.55"/>

    <rect x="0" y="45" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.2"/>
    <rect class="attn-3" x="15" y="45" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="30" y="45" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.35"/>
    <rect class="attn-2" x="45" y="45" width="12" height="12" rx="2" fill="#38bdf8"/>
  </g>
  <text x="112" y="135" class="mono" font-size="9.5" fill="#f1f5f9" font-weight="600">softmax(QKᵀ/√dₖ)V</text>
  <text x="112" y="151" class="mono" font-size="9" fill="#94a3b8">Multi-Head Attn</text>
  <text x="112" y="165" class="mono" font-size="9" fill="#94a3b8">LayerNorm + PosEnc</text>

  <text x="36" y="196" class="mono" font-size="10" fill="#f1f5f9">• Transformer Architectures</text>
  <text x="36" y="212" class="mono" font-size="10" fill="#94a3b8">• Reasoning &amp; Chatbots</text>
  <text x="36" y="226" class="mono" font-size="9.5" fill="#38bdf8">status: active_research</text>

  <!-- ================================================================== -->
  <!-- PILLAR 2: COMPUTER VISION                                          -->
  <!-- ================================================================== -->
  <rect x="250" y="58" width="202" height="178" rx="10" fill="#111827" stroke="#fb7185" stroke-width="1.4"/>
  <text x="264" y="80" class="mono" font-size="12" font-weight="700" fill="#fb7185">02 // COMPUTER VISION</text>
  <text x="264" y="96" class="sans" font-size="10.5" fill="#94a3b8">Visión Artificial · 计算机视觉</text>

  <!-- Vision Patch Grid + Animated Detection Bounding Box -->
  <rect x="264" y="108" width="174" height="68" rx="6" fill="#0d1320" stroke="#1e293b" stroke-width="0.8"/>
  <!-- Spatial feature grid -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.8">
    <line x1="286" y1="114" x2="286" y2="170"/><line x1="304" y1="114" x2="304" y2="170"/>
    <line x1="322" y1="114" x2="322" y2="170"/><line x1="340" y1="114" x2="340" y2="170"/>
    <line x1="270" y1="128" x2="354" y2="128"/><line x1="270" y1="142" x2="354" y2="142"/>
    <line x1="270" y1="156" x2="354" y2="156"/>
  </g>
  <!-- Animated Scanning ROI Box -->
  <g class="cv-box">
    <rect x="274" y="117" width="38" height="30" rx="2" fill="none" stroke="#fb7185" stroke-width="1.8"/>
    <circle cx="293" cy="132" r="2.5" fill="#38bdf8"/>
  </g>
  <text x="362" y="134" class="mono" font-size="9.5" fill="#f1f5f9" font-weight="600">ViT / Conv2D</text>
  <text x="362" y="149" class="mono" font-size="9" fill="#94a3b8">Patch Tokens</text>
  <text x="362" y="164" class="mono" font-size="9" fill="#34d399">conf: 0.994</text>

  <text x="264" y="196" class="mono" font-size="10" fill="#f1f5f9">• Visual Perception &amp; ViT</text>
  <text x="264" y="212" class="mono" font-size="10" fill="#94a3b8">• Detection &amp; Feature Maps</text>
  <text x="264" y="226" class="mono" font-size="9.5" fill="#fb7185">projects: releasing_soon</text>

  <!-- ================================================================== -->
  <!-- PILLAR 3: DEEP LEARNING & ML                                       -->
  <!-- ================================================================== -->
  <rect x="478" y="58" width="202" height="178" rx="10" fill="#111827" stroke="#c084fc" stroke-width="1.4"/>
  <text x="492" y="80" class="mono" font-size="12" font-weight="700" fill="#c084fc">03 // DEEP LEARNING</text>
  <text x="492" y="96" class="sans" font-size="10.5" fill="#94a3b8">Machine Learning · 深度学习</text>

  <!-- Loss Convergence & Neural Graph -->
  <rect x="492" y="108" width="174" height="68" rx="6" fill="#0d1320" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="504" y1="120" x2="504" y2="166" stroke="#64748b" stroke-width="1"/>
  <line x1="504" y1="166" x2="584" y2="166" stroke="#64748b" stroke-width="1"/>
  <path d="M 506 123 Q 522 126, 532 144 T 560 160 T 582 163" fill="none" stroke="#c084fc" stroke-width="2.2"/>
  <circle class="attn-1" cx="582" cy="163" r="3.5" fill="#34d399"/>
  <text x="592" y="134" class="mono" font-size="9.5" fill="#f1f5f9" font-weight="600">∇θ L(θ) → 0</text>
  <text x="592" y="149" class="mono" font-size="9" fill="#94a3b8">From Scratch</text>
  <text x="592" y="164" class="mono" font-size="9" fill="#94a3b8">NumPy &amp; CUDA</text>

  <text x="492" y="196" class="mono" font-size="10" fill="#f1f5f9">• Neural Nets from Scratch</text>
  <text x="492" y="212" class="mono" font-size="10" fill="#94a3b8">• Predictive &amp; Sequence ML</text>
  <text x="492" y="226" class="mono" font-size="9.5" fill="#c084fc">engine: math + backprop</text>

  <!-- ================================================================== -->
  <!-- PILLAR 4: AUTONOMOUS AI AGENTS                                     -->
  <!-- ================================================================== -->
  <rect x="706" y="58" width="192" height="178" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.4"/>
  <text x="720" y="80" class="mono" font-size="12" font-weight="700" fill="#34d399">04 // AI AGENTS</text>
  <text x="720" y="96" class="sans" font-size="10.5" fill="#94a3b8">Agentes de IA · 智能体</text>

  <!-- Agent Cognitive Loop Ring -->
  <rect x="720" y="108" width="164" height="68" rx="6" fill="#0d1320" stroke="#1e293b" stroke-width="0.8"/>
  <circle class="agent-ring" cx="754" cy="142" r="20" fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="18 8"/>
  <circle cx="754" cy="142" r="6" fill="#34d399" opacity="0.85"/>
  <text x="784" y="133" class="mono" font-size="9.5" fill="#f1f5f9" font-weight="600">Think → Act</text>
  <text x="784" y="148" class="mono" font-size="9" fill="#94a3b8">C++ Memory</text>
  <text x="784" y="163" class="mono" font-size="9" fill="#94a3b8">Tool Execution</text>

  <text x="720" y="196" class="mono" font-size="10" fill="#f1f5f9">• Second-Brain Memory</text>
  <text x="720" y="212" class="mono" font-size="10" fill="#94a3b8">• Autonomous Workflows</text>
  <text x="720" y="226" class="mono" font-size="9.5" fill="#34d399">mode: autonomous_loop</text>
</svg>
