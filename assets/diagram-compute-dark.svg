<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 192" width="100%" role="img" aria-label="Figure 03: Optimization Dynamics and Research Stack">
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .probe { animation: sweepX 5s ease-in-out infinite; }
    .bar-a { animation: barPulse 3.2s ease-in-out infinite; }
    .bar-b { animation: barPulse 3.2s ease-in-out 0.8s infinite; }
    @keyframes sweepX {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(255px); }
    }
    @keyframes barPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  </style>

  <text x="0" y="14" class="mono" font-size="10.5" font-weight="600" fill="#86a2ff">FIG. 03 // OPTIMIZATION CONVERGENCE &amp; SCIENTIFIC COMPUTING ALLOCATION</text>
  <line x1="0" y1="22" x2="880" y2="22" stroke="#2b3846" stroke-width="1"/>
  <line x1="440" y1="34" x2="440" y2="182" stroke="#2b3846" stroke-width="1"/>

  <!-- LEFT: FLOATING LOSS CURVE AXES (ZERO GRAY BOX!) -->
  <text x="4" y="44" class="mono" font-size="10" font-weight="600" fill="#93a2b1">A // CROSS-ENTROPY CONVERGENCE L(theta)</text>
  <line x1="32" y1="58" x2="32" y2="162" stroke="#e4e9ee" stroke-width="1.2"/>
  <line x1="32" y1="162" x2="404" y2="162" stroke="#e4e9ee" stroke-width="1.2"/>
  <line x1="32" y1="84" x2="404" y2="84" stroke="#2b3846" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="32" y1="112" x2="404" y2="112" stroke="#2b3846" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="32" y1="140" x2="404" y2="140" stroke="#2b3846" stroke-width="0.8" stroke-dasharray="3 3"/>

  <path d="M 36 66 C 88 72, 126 118, 196 135 C 264 148, 330 150, 398 151" fill="none" stroke="#93a2b1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M 36 63 C 85 70, 122 124, 194 141 C 264 154, 332 156, 398 157" fill="none" stroke="#86a2ff" stroke-width="2.3"/>

  <g class="probe">
    <line x1="78" y1="58" x2="78" y2="162" stroke="#86a2ff" stroke-width="1" opacity="0.65"/>
    <rect x="75" y="60" width="6" height="6" fill="#86a2ff"/>
  </g>
  <text x="32" y="180" class="mono" font-size="9.2" fill="#93a2b1">STEPS: 0 -&gt; 10^5   |   SOLID: TRAIN_LOSS   |   DASHED: VAL_LOSS</text>

  <!-- RIGHT: FLOATING COBALT TELEMETRY LINES (ZERO GRAY TRACK BOXES!) -->
  <text x="462" y="44" class="mono" font-size="10" font-weight="600" fill="#93a2b1">B // CORE RESEARCH STACK &amp; RUNTIME</text>
  <g transform="translate(462, 64)">
    <text x="0" y="9" class="mono" font-size="10" fill="#e4e9ee" font-weight="500">Python / PyTorch / NumPy</text>
    <line x1="200" y1="5" x2="404" y2="5" stroke="#2b3846" stroke-width="2"/>
    <line class="bar-a" x1="200" y1="5" x2="392" y2="5" stroke="#86a2ff" stroke-width="4"/>

    <text x="0" y="34" class="mono" font-size="10" fill="#e4e9ee" font-weight="500">Transformers &amp; Attention</text>
    <line x1="200" y1="30" x2="404" y2="30" stroke="#2b3846" stroke-width="2"/>
    <line class="bar-b" x1="200" y1="30" x2="384" y2="30" stroke="#86a2ff" stroke-width="4"/>

    <text x="0" y="59" class="mono" font-size="10" fill="#e4e9ee" font-weight="500">Computer Vision &amp; GNC</text>
    <line x1="200" y1="55" x2="404" y2="55" stroke="#2b3846" stroke-width="2"/>
    <line class="bar-a" x1="200" y1="55" x2="372" y2="55" stroke="#86a2ff" stroke-width="4"/>

    <text x="0" y="84" class="mono" font-size="10" fill="#e4e9ee" font-weight="500">C++ / Agent Memory Graphs</text>
    <line x1="200" y1="80" x2="404" y2="80" stroke="#2b3846" stroke-width="2"/>
    <line class="bar-b" x1="200" y1="80" x2="364" y2="80" stroke="#86a2ff" stroke-width="4"/>

    <text x="0" y="109" class="mono" font-size="10" fill="#e4e9ee" font-weight="500">Arch Linux / Zsh / TypeScript</text>
    <line x1="200" y1="105" x2="404" y2="105" stroke="#2b3846" stroke-width="2"/>
    <line class="bar-a" x1="200" y1="105" x2="378" y2="105" stroke="#86a2ff" stroke-width="4"/>
  </g>
</svg>
