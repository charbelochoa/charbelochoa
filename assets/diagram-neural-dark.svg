<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="100%" role="img" aria-label="Figure 01: Multimodal Neural and Agentic Pipeline">
  <style>
    .display { font-family: 'Bricolage Grotesque', 'Helvetica Neue', -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 5 5; animation: flowFwd 1.6s linear infinite; }
    .flow-back { stroke-dasharray: 4 6; animation: flowRev 2.2s linear infinite; }
    .c1 { animation: pulseA 2.4s ease-in-out infinite; }
    .c2 { animation: pulseA 2.4s ease-in-out 0.6s infinite; }
    .c3 { animation: pulseA 2.4s ease-in-out 1.2s infinite; }
    .roi { animation: scanRoi 3.8s ease-in-out infinite; }
    .ring { transform-origin: 720px 104px; animation: rotRing 9s linear infinite; }
    @keyframes flowFwd { to { stroke-dashoffset: -20; } }
    @keyframes flowRev { to { stroke-dashoffset: 20; } }
    @keyframes pulseA { 0%, 100% { opacity: 1; } 50% { opacity: 0.22; } }
    @keyframes scanRoi {
      0%, 100% { transform: translate(0px, 0px); }
      35% { transform: translate(34px, 4px); }
      70% { transform: translate(16px, 16px); }
    }
    @keyframes rotRing { to { transform: rotate(360deg); } }
  </style>

  <!-- Minimalist Floating Cobalt Header Rule (Zero Background Fill!) -->
  <text x="0" y="14" class="mono" font-size="10.5" font-weight="600" fill="#86a2ff">FIG. 01 // MULTIMODAL NEURAL &amp; AGENTIC PIPELINE</text>
  <line x1="0" y1="22" x2="880" y2="22" stroke="#2b3846" stroke-width="1"/>

  <!-- Column Vertical Hairline Separators (Pure Architectural Drafting Lines, Zero Gray Boxes!) -->
  <line x1="214" y1="36" x2="214" y2="188" stroke="#2b3846" stroke-width="1"/>
  <line x1="438" y1="36" x2="438" y2="188" stroke="#2b3846" stroke-width="1"/>
  <line x1="662" y1="36" x2="662" y2="188" stroke="#2b3846" stroke-width="1"/>

  <!-- Animated Cobalt Signal Flows Across Stages -->
  <line class="flow" x1="196" y1="104" x2="232" y2="104" stroke="#86a2ff" stroke-width="2"/>
  <line class="flow" x1="420" y1="104" x2="456" y2="104" stroke="#86a2ff" stroke-width="2"/>
  <line class="flow" x1="644" y1="104" x2="680" y2="104" stroke="#86a2ff" stroke-width="2"/>

  <!-- Feedback Loop Along Bottom -->
  <path class="flow-back" d="M 768 194 L 768 212 L 96 212 L 96 194" fill="none" stroke="#86a2ff" stroke-width="1.3"/>
  <text x="305" y="226" class="mono" font-size="9.5" fill="#93a2b1">GRADIENT BACKPROPAGATION &amp; AGENT MEMORY FEEDBACK</text>

  <!-- STAGE 01: LLMs & ATTENTION -->
  <text x="6" y="46" class="mono" font-size="10.5" font-weight="600" fill="#86a2ff">01 / LLMs &amp; ATTENTION</text>
  <text x="6" y="63" class="display" font-size="13" font-weight="700" fill="#e4e9ee">Transformer Blocks</text>
  <g transform="translate(8, 76)">
    <rect class="c1" x="0" y="0" width="12" height="12" fill="#86a2ff"/>
    <rect class="c2" x="15" y="0" width="12" height="12" fill="#86a2ff" opacity="0.35"/>
    <rect class="c3" x="30" y="0" width="12" height="12" fill="#86a2ff" opacity="0.7"/>
    <rect x="45" y="0" width="12" height="12" fill="#86a2ff" opacity="0.18"/>
    <rect x="0" y="15" width="12" height="12" fill="#86a2ff" opacity="0.25"/>
    <rect class="c2" x="15" y="15" width="12" height="12" fill="#86a2ff"/>
    <rect x="30" y="15" width="12" height="12" fill="#86a2ff" opacity="0.45"/>
    <rect class="c1" x="45" y="15" width="12" height="12" fill="#86a2ff" opacity="0.82"/>
    <rect class="c3" x="0" y="30" width="12" height="12" fill="#86a2ff" opacity="0.6"/>
    <rect x="15" y="30" width="12" height="12" fill="#86a2ff" opacity="0.22"/>
    <rect class="c1" x="30" y="30" width="12" height="12" fill="#86a2ff"/>
    <rect class="c2" x="45" y="30" width="12" height="12" fill="#86a2ff" opacity="0.5"/>
    <rect x="0" y="45" width="12" height="12" fill="#86a2ff" opacity="0.15"/>
    <rect class="c3" x="15" y="45" width="12" height="12" fill="#86a2ff" opacity="0.72"/>
    <rect x="30" y="45" width="12" height="12" fill="#86a2ff" opacity="0.3"/>
    <rect class="c2" x="45" y="45" width="12" height="12" fill="#86a2ff"/>
  </g>
  <text x="80" y="94" class="mono" font-size="9.5" fill="#e4e9ee" font-weight="600">QK^T / sqrt(d_k)</text>
  <text x="80" y="110" class="mono" font-size="9" fill="#93a2b1">Positional Enc</text>
  <text x="80" y="126" class="mono" font-size="9" fill="#93a2b1">LayerNorm + FFN</text>
  <text x="6" y="162" class="mono" font-size="9.6" fill="#e4e9ee">Autoregressive Decoding</text>
  <text x="6" y="178" class="mono" font-size="9.2" fill="#93a2b1">Dialogue &amp; Reasoning</text>

  <!-- STAGE 02: COMPUTER VISION -->
  <text x="234" y="46" class="mono" font-size="10.5" font-weight="600" fill="#86a2ff">02 / COMPUTER VISION</text>
  <text x="234" y="63" class="display" font-size="13" font-weight="700" fill="#e4e9ee">Spatial Perception</text>
  <g stroke="#2b3846" stroke-width="0.9">
    <line x1="252" y1="76" x2="252" y2="134"/><line x1="270" y1="76" x2="270" y2="134"/>
    <line x1="288" y1="76" x2="288" y2="134"/><line x1="306" y1="76" x2="306" y2="134"/>
    <line x1="236" y1="90" x2="322" y2="90"/><line x1="236" y1="105" x2="322" y2="105"/>
    <line x1="236" y1="120" x2="322" y2="120"/>
  </g>
  <g class="roi">
    <rect x="239" y="79" width="36" height="28" fill="none" stroke="#86a2ff" stroke-width="1.8"/>
    <line x1="254" y1="93" x2="260" y2="93" stroke="#86a2ff" stroke-width="1.2"/>
    <line x1="257" y1="90" x2="257" y2="96" stroke="#86a2ff" stroke-width="1.2"/>
  </g>
  <text x="332" y="94" class="mono" font-size="9.5" fill="#e4e9ee" font-weight="600">ViT / Conv2D</text>
  <text x="332" y="110" class="mono" font-size="9" fill="#93a2b1">16x16 Patches</text>
  <text x="332" y="126" class="mono" font-size="9" fill="#86a2ff">OPTICAL NAV</text>
  <text x="234" y="162" class="mono" font-size="9.6" fill="#e4e9ee">Feature Extraction</text>
  <text x="234" y="178" class="mono" font-size="9.2" fill="#93a2b1">Terrain &amp; Scene Vision</text>

  <!-- STAGE 03: DEEP LEARNING -->
  <text x="458" y="46" class="mono" font-size="10.5" font-weight="600" fill="#86a2ff">03 / DEEP LEARNING</text>
  <text x="458" y="63" class="display" font-size="13" font-weight="700" fill="#e4e9ee">Gradient Optimization</text>
  <line x1="464" y1="78" x2="464" y2="132" stroke="#93a2b1" stroke-width="1.1"/>
  <line x1="464" y1="132" x2="544" y2="132" stroke="#93a2b1" stroke-width="1.1"/>
  <path d="M 466 82 Q 484 86, 496 108 T 522 124 T 542 127" fill="none" stroke="#86a2ff" stroke-width="2.2"/>
  <circle class="c1" cx="542" cy="127" r="3.5" fill="#86a2ff"/>
  <text x="554" y="94" class="mono" font-size="9.5" fill="#e4e9ee" font-weight="600">grad L(theta)</text>
  <text x="554" y="110" class="mono" font-size="9" fill="#93a2b1">From Scratch</text>
  <text x="554" y="126" class="mono" font-size="9" fill="#93a2b1">NumPy / CUDA</text>
  <text x="458" y="162" class="mono" font-size="9.6" fill="#e4e9ee">First-Principles Backprop</text>
  <text x="458" y="178" class="mono" font-size="9.2" fill="#93a2b1">Statistical &amp; Sequence ML</text>

  <!-- STAGE 04: AI AGENTS -->
  <text x="682" y="46" class="mono" font-size="10.5" font-weight="600" fill="#86a2ff">04 / AI AGENTS</text>
  <text x="682" y="63" class="display" font-size="13" font-weight="700" fill="#e4e9ee">Autonomous Control</text>
  <circle class="ring" cx="720" cy="104" r="20" fill="none" stroke="#86a2ff" stroke-width="1.8" stroke-dasharray="16 7"/>
  <rect x="716" y="100" width="8" height="8" fill="#86a2ff"/>
  <text x="754" y="94" class="mono" font-size="9.5" fill="#e4e9ee" font-weight="600">Plan -&gt; Act</text>
  <text x="754" y="110" class="mono" font-size="9" fill="#93a2b1">C++ Memory</text>
  <text x="754" y="126" class="mono" font-size="9" fill="#93a2b1">Flight / Tools</text>
  <text x="682" y="162" class="mono" font-size="9.6" fill="#e4e9ee">Second-Brain Graphs</text>
  <text x="682" y="178" class="mono" font-size="9.2" fill="#93a2b1">Mission Autonomy</text>
</svg>
