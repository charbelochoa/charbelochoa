<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 248" width="100%" role="img" aria-label="Figure 02: Training Convergence and Research Compute Environment">
  <defs>
    <pattern id="cadGrid2" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#e9edf1" stroke-width="0.8"/>
    </pattern>
  </defs>
  <style>
    .display { font-family: 'Bricolage Grotesque', 'Helvetica Neue', -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .probe { animation: sweepX 5s ease-in-out infinite; }
    .bar-a { animation: barPulse 3.2s ease-in-out infinite; }
    .bar-b { animation: barPulse 3.2s ease-in-out 0.8s infinite; }
    @keyframes sweepX {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(245px); }
    }
    @keyframes barPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  </style>

  <rect x="1" y="1" width="878" height="246" rx="4" fill="#f4f6f8" stroke="#cbd3db" stroke-width="1"/>
  <rect x="2" y="2" width="876" height="244" fill="url(#cadGrid2)" opacity="0.8"/>

  <!-- Header -->
  <rect x="1" y="1" width="878" height="36" fill="#ffffff"/>
  <line x1="1" y1="37" x2="879" y2="37" stroke="#cbd3db" stroke-width="1"/>
  <rect x="1" y="1" width="4" height="36" fill="#2b50d6"/>
  <text x="20" y="23" class="mono" font-size="11" font-weight="600" fill="#17212b">FIG. 02 — OPTIMIZATION DYNAMICS &amp; COMPUTE ENVIRONMENT SPECIFICATION</text>
  <text x="668" y="23" class="mono" font-size="10.5" fill="#5b6b7a">REF: ARCH // CUDA // C++</text>

  <!-- LEFT PANEL: Empirical Loss Curve Drafting Plot -->
  <rect x="18" y="52" width="412" height="178" rx="4" fill="#ffffff" stroke="#cbd3db" stroke-width="1"/>
  <text x="34" y="74" class="mono" font-size="10.5" font-weight="600" fill="#2b50d6">PLOT A // CROSS-ENTROPY CONVERGENCE L(theta)</text>

  <!-- Plot Axes -->
  <line x1="52" y1="90" x2="52" y2="196" stroke="#17212b" stroke-width="1.2"/>
  <line x1="52" y1="196" x2="404" y2="196" stroke="#17212b" stroke-width="1.2"/>
  <!-- Horizontal reference rules -->
  <line x1="52" y1="116" x2="404" y2="116" stroke="#cbd3db" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="52" y1="144" x2="404" y2="144" stroke="#cbd3db" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="52" y1="172" x2="404" y2="172" stroke="#cbd3db" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Validation curve (dashed steel) & Training curve (solid cobalt) -->
  <path d="M 56 98 C 105 104, 138 152, 205 169 C 268 182, 330 184, 398 185" fill="none" stroke="#5b6b7a" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M 56 95 C 102 102, 134 158, 202 175 C 268 188, 332 190, 398 191" fill="none" stroke="#2b50d6" stroke-width="2.3"/>

  <!-- Animated Evaluation Probe Line -->
  <g class="probe">
    <line x1="95" y1="90" x2="95" y2="196" stroke="#2b50d6" stroke-width="1" opacity="0.6"/>
    <rect x="92" y="92" width="6" height="6" fill="#2b50d6"/>
  </g>

  <text x="54" y="214" class="mono" font-size="9.5" fill="#5b6b7a">STEPS: 0 -&gt; 10^5   |   SOLID: TRAIN_LOSS   |   DASHED: VAL_LOSS</text>

  <!-- RIGHT PANEL: Research Stack & Linux Systems Matrix -->
  <rect x="448" y="52" width="414" height="178" rx="4" fill="#ffffff" stroke="#cbd3db" stroke-width="1"/>
  <text x="464" y="74" class="mono" font-size="10.5" font-weight="600" fill="#2b50d6">SPEC B // RESEARCH STACK &amp; RUNTIME ALLOCATION</text>

  <!-- Stack Bars in Cobalt Ink -->
  <g transform="translate(464, 92)">
    <text x="0" y="11" class="mono" font-size="10" fill="#17212b" font-weight="500">Python / PyTorch / NumPy</text>
    <rect x="195" y="1" width="185" height="12" rx="2" fill="#e9edf1" stroke="#cbd3db" stroke-width="0.8"/>
    <rect class="bar-a" x="195" y="1" width="172" height="12" rx="2" fill="#2b50d6"/>

    <text x="0" y="37" class="mono" font-size="10" fill="#17212b" font-weight="500">Transformers &amp; Attention</text>
    <rect x="195" y="27" width="185" height="12" rx="2" fill="#e9edf1" stroke="#cbd3db" stroke-width="0.8"/>
    <rect class="bar-b" x="195" y="27" width="164" height="12" rx="2" fill="#2b50d6"/>

    <text x="0" y="63" class="mono" font-size="10" fill="#17212b" font-weight="500">Computer Vision &amp; ViT</text>
    <rect x="195" y="53" width="185" height="12" rx="2" fill="#e9edf1" stroke="#cbd3db" stroke-width="0.8"/>
    <rect class="bar-a" x="195" y="53" width="152" height="12" rx="2" fill="#2b50d6"/>

    <text x="0" y="89" class="mono" font-size="10" fill="#17212b" font-weight="500">C++ / Agent Memory Systems</text>
    <rect x="195" y="79" width="185" height="12" rx="2" fill="#e9edf1" stroke="#cbd3db" stroke-width="0.8"/>
    <rect class="bar-b" x="195" y="79" width="144" height="12" rx="2" fill="#2b50d6"/>

    <text x="0" y="115" class="mono" font-size="10" fill="#17212b" font-weight="500">Arch Linux / Zsh / TypeScript</text>
    <rect x="195" y="105" width="185" height="12" rx="2" fill="#e9edf1" stroke="#cbd3db" stroke-width="0.8"/>
    <rect class="bar-a" x="195" y="105" width="158" height="12" rx="2" fill="#2b50d6"/>
  </g>
</svg>
