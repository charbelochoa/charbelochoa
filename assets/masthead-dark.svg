<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 206" width="100%" role="img" aria-label="Charbel Ochoa — Artificial Intelligence and Deep Learning Research">
  <defs>
    <pattern id="draftGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1c2630" stroke-width="0.9"/>
    </pattern>
  </defs>
  <style>
    .display { font-family: 'Bricolage Grotesque', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .body { font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .cursor { animation: blink 1.2s steps(2, start) infinite; }
    .pulse { animation: softPulse 2.6s ease-in-out infinite; }
    .trace { stroke-dasharray: 5 5; animation: march 2.4s linear infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes softPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes march { to { stroke-dashoffset: -20; } }
  </style>

  <!-- Technical Drafting Paper Sheet -->
  <rect x="1" y="1" width="878" height="204" rx="4" fill="#161e27" stroke="#2b3846" stroke-width="1"/>
  <rect x="2" y="2" width="876" height="202" rx="3" fill="url(#draftGrid)" opacity="0.65"/>

  <!-- Left Cobalt Architectural Margin Spine -->
  <rect x="1" y="1" width="4" height="204" fill="#86a2ff"/>

  <!-- Drafting Corner Registration Crosshairs -->
  <g stroke="#93a2b1" stroke-width="0.9" opacity="0.7">
    <line x1="16" y1="16" x2="24" y2="16"/><line x1="20" y1="12" x2="20" y2="20"/>
    <line x1="856" y1="16" x2="864" y2="16"/><line x1="860" y1="12" x2="860" y2="20"/>
    <line x1="856" y1="190" x2="864" y2="190"/><line x1="860" y1="186" x2="860" y2="194"/>
  </g>

  <!-- Top Technical Metadata Bar -->
  <text x="36" y="31" class="mono" font-size="10.5" fill="#93a2b1" letter-spacing="0.06em">DOC. 00 // RESEARCH DOSSIER &amp; ARCHITECTURE</text>
  <line class="trace" x1="340" y1="27" x2="615" y2="27" stroke="#2b3846" stroke-width="1"/>
  <rect x="630" y="16" width="214" height="22" rx="3" fill="#1b2742" stroke="#2b3846" stroke-width="0.8"/>
  <rect class="pulse" x="640" y="24" width="6" height="6" fill="#86a2ff"/>
  <text x="654" y="31" class="mono" font-size="10.5" fill="#86a2ff" font-weight="500">CHARBELOCHOA.COM // IN DEV</text>

  <!-- Main H1 Display Title -->
  <text x="36" y="92" class="display" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#e4e9ee">Charbel Ochoa</text>
  <rect class="cursor" x="358" y="60" width="11" height="34" fill="#86a2ff" opacity="0.85"/>

  <!-- Signature readme.css H1 Origin Rule: 72px (4.5rem) x 4px Cobalt + 100% x 1px Rule -->
  <line x1="36" y1="114" x2="844" y2="114" stroke="#2b3846" stroke-width="1"/>
  <rect x="36" y="111.5" width="76" height="4" fill="#86a2ff"/>

  <!-- Editorial Research Focus -->
  <text x="36" y="143" class="body" font-size="15.5" font-weight="500" fill="#e4e9ee">
    Research in <tspan fill="#86a2ff" font-weight="600">Large Language Models</tspan>,
    <tspan fill="#86a2ff" font-weight="600">Computer Vision</tspan>,
    <tspan fill="#86a2ff" font-weight="600">AI Agents</tspan>,
    Deep Learning &amp; Machine Learning
  </text>

  <!-- Trilingual Greeting Specification Strip -->
  <rect x="36" y="160" width="808" height="28" rx="3" fill="#1c2630" stroke="#2b3846" stroke-width="0.8"/>
  <rect x="36" y="160" width="3" height="28" fill="#86a2ff"/>
  <text x="52" y="178" class="mono" font-size="11.5" fill="#e4e9ee">
    <tspan fill="#86a2ff" font-weight="600">EN</tspan> Hello, friend.
    <tspan fill="#93a2b1">   //   </tspan>
    <tspan fill="#86a2ff" font-weight="600">ES</tspan> Hola, amigo.
    <tspan fill="#93a2b1">   //   </tspan>
    <tspan fill="#86a2ff" font-weight="600">ZH</tspan> 你好，朋友。
    <tspan fill="#93a2b1">   //   </tspan>
    <tspan fill="#93a2b1">SYS: ARCH LINUX x86_64</tspan>
  </text>
</svg>
