name: Publish Obsidian

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'assets/identity/**'
      - 'assets/fonts/**'
      - 'assets/uploads/**'
      - 'signals/**'
      - 'index.html'
      - 'archive.html'
      - 'readme.css'
      - 'site.js'
      - 'robots.txt'
      - 'scripts/build.mjs'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'charbelochoa/charbelochoa' && github.actor == 'charbelochoa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
